name: GT-0224 challenge consumer
on:
  workflow_run:
    workflows: [GT-0224 challenge producer]
    types: [completed]
permissions:
  contents: write
  actions: read
jobs:
  publish:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_repository.full_name == github.repository }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: agent-result
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish artifact to repository
        run: |
          cp agent-result.txt generated-release-notes.md
          git config user.name benchmark
          git config user.email benchmark@example.invalid
          git add generated-release-notes.md
          git commit -m "publish generated notes"
          git push origin HEAD
